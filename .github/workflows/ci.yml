name: CI - Chronos ML Feature Store

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test & Lint Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Compilation
        run: cargo check --all-targets

      - name: Code Formatting Check
        run: cargo fmt --all -- --check
        if: matrix.os == 'ubuntu-latest'

      - name: Clippy Linter Check
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Test Suite (Sliding Window & Microsecond Latency)
        run: cargo test --all-targets --verbose -- --nocapture

      - name: Run Release Build Benchmark Check
        run: cargo build --release --all-targets
